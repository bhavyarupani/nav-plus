[versions]
agp                  = "8.7.3"
kotlin               = "2.0.21"
ksp                  = "2.0.21-1.0.28"
hilt                 = "2.54"
composeBom           = "2024.12.01"
activityCompose      = "1.9.3"
lifecycle            = "2.8.7"
navigationCompose    = "2.8.5"
hiltNavigationCompose = "1.2.0"
room                 = "2.6.1"
maplibre             = "11.6.1"
graphhopper          = "10.0"
okhttp               = "4.12.0"
retrofit             = "2.11.0"
moshi                = "1.15.1"
coroutines           = "1.9.0"
playLocation         = "21.3.0"
datastore            = "1.1.1"
work                 = "2.10.0"
coreKtx              = "1.15.0"
appcompat            = "1.7.0"
compileSdk           = "35"
minSdk               = "24"
targetSdk            = "35"

[libraries]
# Compose
compose-bom                    = { group = "androidx.compose",           name = "compose-bom",                  version.ref = "composeBom" }
compose-ui                     = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-tooling-preview     = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
compose-ui-tooling             = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-material3              = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons         = { group = "androidx.compose.material",  name = "material-icons-extended" }
activity-compose               = { group = "androidx.activity",          name = "activity-compose",             version.ref = "activityCompose" }
lifecycle-runtime-compose      = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose",    version.ref = "lifecycle" }
lifecycle-viewmodel-compose    = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose",  version.ref = "lifecycle" }
lifecycle-viewmodel-ktx        = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-ktx",      version.ref = "lifecycle" }
navigation-compose             = { group = "androidx.navigation",        name = "navigation-compose",           version.ref = "navigationCompose" }

# Hilt
hilt-android          = { group = "com.google.dagger", name = "hilt-android",          version.ref = "hilt" }
hilt-compiler         = { group = "com.google.dagger", name = "hilt-android-compiler",  version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",  name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Room
room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler",  version.ref = "room" }

# Map
maplibre-android = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }

# Routing
graphhopper-core = { group = "com.graphhopper", name = "graphhopper-core", version.ref = "graphhopper" }

# Network
okhttp            = { group = "com.squareup.okhttp3",   name = "okhttp",              version.ref = "okhttp" }
okhttp-logging    = { group = "com.squareup.okhttp3",   name = "logging-interceptor", version.ref = "okhttp" }
retrofit          = { group = "com.squareup.retrofit2", name = "retrofit",            version.ref = "retrofit" }
retrofit-moshi    = { group = "com.squareup.retrofit2", name = "converter-moshi",     version.ref = "retrofit" }
moshi-kotlin      = { group = "com.squareup.moshi",     name = "moshi-kotlin",        version.ref = "moshi" }
moshi-compiler    = { group = "com.squareup.moshi",     name = "moshi-kotlin-codegen", version.ref = "moshi" }

# Coroutines
coroutines-core    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",    version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",  version.ref = "coroutines" }

# Location
play-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playLocation" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# WorkManager
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Core Android
core-ktx  = { group = "androidx.core",     name = "core-ktx",  version.ref = "coreKtx" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# Testing
junit       = { group = "junit",                                 name = "junit",                    version = "4.13.2" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
turbine     = { group = "app.cash.turbine",           name = "turbine",                 version = "1.2.0" }

[plugins]
android-application = { id = "com.android.application",           version.ref = "agp" }
android-library     = { id = "com.android.library",               version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",            version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android",     version.ref = "hilt" }
room                = { id = "androidx.room",                      version.ref = "room" }
